        let currentLang = 'ar';

        function updateUI() {
            const data = item[currentLang];
            document.getElementById('d-title').innerText = data.title;
            document.getElementById('d-body').innerText = data.body;
            document.getElementById('d-hero-img').src = item.img;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = currentLang;

            document.querySelectorAll('[data-en]').forEach(el => {
                el.innerText = currentLang === 'ar' ? el.getAttribute('data-ar') : el.getAttribute('data-en');
            });
        }

        document.getElementById('lang-switch-details').addEventListener('click', () => {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.getElementById('lang-switch-details').innerText = currentLang === 'ar' ? 'EN' : 'AR';
